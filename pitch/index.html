:root { --ui: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; font-family: var(--ui); color: #000; background: #fff; }
h1 { font-size: 18px; margin: 4px 0 8px; }
.note { font-size: 13px; color: #444; line-height: 1.6; margin: 0 0 16px; }
.card { --ak-weight: 1; border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 0 0 20px; }
.card h2 { font-size: 14px; margin: 0 0 10px; color: #333; font-weight: 600; }
.row { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-top: 1px dashed #ddd; }
.row:first-of-type { border-top: none; }
.label { flex: 0 0 24px; font: 600 16px var(--ui); padding-top: 4px; }

.knob span.name { flex: 0 0 6.5em; }
.knob input[type=range] { flex: 1 1 auto; }
.knob output { flex: 0 0 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
.q { font-size: 14px; margin: 10px 0; }
.q .title { font-weight: 600; margin-bottom: 4px; }
.q label { display: inline-block; margin: 3px 10px 3px 0; white-space: nowrap; }
.accept { display: flex; gap: 12px; align-items: center; margin: 2px 0; }
textarea { width: 100%; font-size: 14px; min-height: 2.5em; }
button { font-size: 15px; padding: 8px 14px; margin: 4px 6px 4px 0; border-radius: 6px; border: 1px solid #888; background: #fff; }
button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
.status { font-size: 13px; color: #1a7f37; margin-left: 4px; }
.error { color: #cf222e; }
#share { width: 100%; min-height: 12em; font-size: 12px; font-family: ui-monospace, monospace; }

const BUILD = "f9327d476645";
const KEY = "tunable-blind:" + BUILD;
const BEST = ["差が見えない", "選べない", "どれも良くない"];
const store = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
};
const sections = ["1/4", "2/4", "3/4", "4/4"];

function knob(card, name, label, min, max, step, init, unit) {
  const input = el("input", { type: "range", min, max, step, value: String(init) });
  const out = el("output");
  const apply = () => {
    const v = Number(input.value);
    card.style.setProperty(name, unit ? v + unit : String(v));
    out.textContent = (unit ? v.toFixed(3) + unit : v.toFixed(2));
  };
  input.addEventListener("input", apply);
  apply();
  return { row: el("div", { class: "knob" }, el("span", { class: "name", text: label }), input, out), input, apply, init };
}

for (const item of DATA.items) {
  const [sec, n] = item.id.split("-");
  const title = item.kind === "headline"
    ? `【${sections[sec - 1]}・見出し ${n}/4】${item.family}・${item.sizePx}px`
    : `【${sections[sec - 1]}・本文(参考)】${item.family}・${item.sizePx}px(答えは任意)`;
  const card = el("div", { class: "card" }, el("h2", { text: title }));
  for (const row of item.rows) {
    const text = el("div", { class: "text" + (item.palt ? " palt" : "") });
    text.style.fontFamily = `"${item.family}"`;
    text.style.fontSize = item.sizePx + "px";
    item.graphemes.forEach((g, i) => {
      const s = el("span", { class: "g", text: g });
      s.style.setProperty("--ak-k", row.k[i] + "em");
      text.append(s);
    });
    card.append(el("div", { class: "row" }, el("div", { class: "label", text: row.label }), text));
  }
  const saved = store[item.id];
  const base0 = item.base ?? 0;
  const base = knob(card, "--ak-base", "全体の字間", -0.2, 0.3, 0.005, saved ? saved.base : base0, "em");
  const reset = el("button", { text: "つまみを初期値に戻す" });
  reset.addEventListener("click", () => { base.input.value = String(base0); base.apply(); });
  card.append(el("div", { class: "knobs" }, base.row, reset));

  let bestBox = null;
  if (item.kind === "headline") {
    bestBox = el("div", { class: "q" }, el("div", { class: "title", text: "いちばん良い版" }));
    for (const v of [...item.rows.map((r) => r.label), ...BEST]) {
      const r = el("input", { type: "radio", name: "best-" + item.id, value: v });
      if (saved && saved.best === v) r.checked = true;
      bestBox.append(el("label", {}, r, document.createTextNode(" " + v)));
    }
    card.append(bestBox);
  }
  const acc = el("div", { class: "q" }, el("div", { class: "title", text: "版ごとに" + (item.kind === "headline" ? "" : "(任意)") }));
  for (const row of item.rows) {
    const line = el("div", { class: "accept" }, el("b", { text: row.label }));
    for (const [v, t] of [["ok", "許容できる"], ["ng", "許容できない"]]) {
      const r = el("input", { type: "radio", name: `acc-${item.id}-${row.label}`, value: v });
      if (saved && saved.accept && saved.accept[row.label] === v) r.checked = true;
      line.append(el("label", {}, r, document.createTextNode(" " + t)));
    }
    acc.append(line);
  }
  card.append(acc);
  const comment = el("textarea", { placeholder: "ひとこと(任意)" });
  if (saved && saved.comment) comment.value = saved.comment;
  card.append(el("div", { class: "q" }, comment));
  const status = el("span", { class: "status", text: saved ? `記録済み(${saved.count} 回目)` : "" });
  const rec = el("button", { class: "primary", text: "記録" });
  rec.addEventListener("click", () => {
    const pick = (name) => (card.querySelector(`input[name="${name}"]:checked`) || {}).value || null;
    const best = item.kind === "headline" ? pick("best-" + item.id) : null;
    const accept = Object.fromEntries(item.rows.map((r) => [r.label, pick(`acc-${item.id}-${r.label}`)]));
    if (item.kind === "headline" && (!best || Object.values(accept).some((v) => !v))) {
      status.className = "status error";
      status.textContent = "いちばん良い版と、全部の版の許容を選んでください";
      return;
    }
    const prev = store[item.id];
    store[item.id] = { best, accept, base: Number(base.input.value),
      comment: comment.value.trim(), count: (prev ? prev.count : 0) + 1, at: new Date().toISOString() };
    save();
    status.className = "status";
    status.textContent = `記録済み(${store[item.id].count} 回目)`;
  });
  card.append(rec, status);
  document.getElementById("items").append(card);
}

document.getElementById("make").addEventListener("click", () => {
  const lines = [`tunable-blind build ${BUILD} ${new Date().toISOString()}`];
  for (const item of DATA.items) {
    const r = store[item.id];
    if (!r) { lines.push(`${item.id}: 未記録`); continue; }
    const acc = Object.entries(r.accept).map(([k, v]) => `${k}=${v === "ok" ? "可" : v === "ng" ? "不可" : "-"}`).join(" ");
    lines.push(`${item.id}: 良=${r.best ?? "-"} | ${acc} | base=${r.base.toFixed(3)}em | 記録${r.count}回 ${r.at}` +
      (r.comment ? ` | ${r.comment.replace(/\s+/g, " ")}` : ""));
  }
  document.getElementById("share").value = lines.join("\n");
});
document.getElementById("copy").addEventListener("click", async () => {
  const t = document.getElementById("share");
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand("copy"); }
  document.getElementById("copyStatus").textContent = "コピーしました";
});
</script>
